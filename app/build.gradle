plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.utxo'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.utxo"
        minSdk 28
        targetSdk 35
        versionCode 407
        versionName "0.4.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is sufficient
            // for sideloading. Swap to a dedicated release keystore if uploading to Play.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed wallet UI
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // QR code generation for the Receive screen
    implementation 'com.google.zxing:core:3.5.3'

    // SVG token icons (Android's BitmapFactory can't rasterise SVG; many Minima tokens use SVG urls)
    implementation 'com.caverock:androidsvg-aar:1.4'

    implementation files('libs/minimaapi.aar')
}
